# Scheduled / on-demand: fetch daily challenges from API, solve in parallel, submit.
#
# Triggers:
#   - workflow_dispatch     → run manually from the Actions tab
#   - repository_dispatch   → event type "scheduled-run" (e.g. external cron + PAT calling the API)
#
# Optional: add native GitHub cron under `on:` if you do not use repository_dispatch:
#   schedule:
#     - cron: "0 1 * * *"   # 01:00 UTC daily
#
# Secrets — use "Repository secrets" (Settings → Secrets and variables → Actions):
#   PLAYER_GUID, PLAYER_EMAIL  (required; names are case-sensitive)
#   STAR_DELIVERY_BASE_URL     (optional)
# If those are missing or the repo cannot access org secrets, the solve step exits with an error.
# Secrets are not available to workflows triggered from fork PRs.
#
# External 01:00 example (fine-grained PAT with repo contents + workflows if needed):
#   curl -L -X POST -H "Accept: application/vnd.github+json" \
#        -H "Authorization: Bearer YOUR_PAT" \
#        -H "X-GitHub-Api-Version: 2022-11-28" \
#        https://api.github.com/repos/OWNER/REPO/dispatches \
#        -d '{"event_type":"scheduled-run","client_payload":{}}'
#
# Monorepo: add under `jobs:` → `defaults: run: working-directory: planet-tsp-solver`

name: Scheduled solve + submit

on:
  workflow_dispatch:
  repository_dispatch:
    types: [scheduled-run]

permissions:
  contents: read

concurrency:
  group: scheduled-tsp-solve-submit
  cancel-in-progress: false

jobs:
  solve-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Solve (API) + submit
        env:
          PLAYER_GUID: ${{ secrets.PLAYER_GUID }}
          PLAYER_EMAIL: ${{ secrets.PLAYER_EMAIL }}
          STAR_DELIVERY_BASE_URL: ${{ secrets.STAR_DELIVERY_BASE_URL }}
        run: >-
          python tsp_solver.py
          --from-api
          --all-challenges
          --parallel 6
          --submit
